services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forms
      POSTGRES_PASSWORD: forms
      POSTGRES_DB: forms
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forms"]
      interval: 2s
      retries: 20

volumes:
  pgdata:
