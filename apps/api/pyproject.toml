[project]
name = "voice-survey-api"
version = "0.1.0"
description = "Voice survey platform API: XLSForm module, phone-check, Pipecat survey bot"
readme = "README.md"
authors = [
    { name = "Pradnesh Fernandez A", email = "pradan263@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "beautifulsoup4>=4.15.0",
    "deepdiff>=9.1.0",
    "fastapi>=0.162.0",
    "openpyxl>=3.1.5",
    "pipecat-ai[anthropic,google,groq,openai,runner,silero,webrtc]==1.14.0",
    "pipecat-gnani",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyxform==4.5.0",
    "sqlalchemy>=2",
    "twilio>=9.12.0",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.uv.sources]
pipecat-gnani = { path = "../../../pipecat-gnani", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
